<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deutsch-Heft</title>
<meta name="description" content="Личная тетрадь по немецкому: словарь, спряжения, грамматика, тренировки.">
<meta name="theme-color" content="#f1eff7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Heft">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, pastel tiles on a soft lavender ground, floating black pill navigation. */
:root{
  --bg:#f1eff7; --surface:#ffffff; --surface-2:#f6f5fa; --ink:#121216; --muted:#6b6977; --line:#e2dfeb;
  --nav:#121216; --nav-ink:#cfcdd8; --nav-on:#ffffff; --nav-on-ink:#121216; --on-pastel:#121216;
  --lav:#b9abf8; --orange:#ffbf5c; --blue:#aecbfb; --pink:#f3b0ee; --green:#c2e6ab; --rose:#f8b2c8;
  --der:#aecbfb; --die:#f8b2c8; --das:#c2e6ab; --pl:#ffd28f;
  --ok:#24742a; --bad:#c22a4e; --mark:#ffe28f; --on-mark:#3b2e00;
  --r-xl:30px; --r-lg:24px; --r-md:18px; --r-sm:12px;
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0f13; --surface:#1a1921; --surface-2:#22212a; --ink:#f2f1f7; --muted:#a3a0ae; --line:#2e2d37;
  --nav:#f2f1f7; --nav-ink:#5d5b68; --nav-on:#121216; --nav-on-ink:#ffffff;
  --ok:#93d77e; --bad:#ff8ea8; --mark:#5c4a12; --on-mark:#ffe28f; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f0f13; --surface:#1a1921; --surface-2:#22212a; --ink:#f2f1f7; --muted:#a3a0ae; --line:#2e2d37;
  --nav:#f2f1f7; --nav-ink:#5d5b68; --nav-on:#121216; --nav-on-ink:#ffffff;
  --ok:#93d77e; --bad:#ff8ea8; --mark:#5c4a12; --on-mark:#ffe28f; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
svg{display:block}

.app{max-width:540px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:16px}

/* header */
.hdr{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:12px;margin-bottom:16px}
.round-btn{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;flex:none}
.round-btn svg{width:22px;height:22px}
.round-btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.avatar{background:var(--lav);border:0;color:var(--on-pastel);font-weight:700;font-size:18px}
.hdr-mid{text-align:center;min-width:0}
.hdr-mid b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.hdr-mid span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* nav */
.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(500px,calc(100% - 36px));background:var(--nav);border-radius:999px;padding:7px;display:flex;justify-content:space-between;box-shadow:0 10px 30px rgba(18,18,22,.18)}
.nav button{width:58px;height:58px;border-radius:50%;border:0;background:none;color:var(--nav-ink);display:grid;place-items:center;padding:0}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{background:var(--nav-on);color:var(--nav-on-ink)}

/* type */
h2.sec{font-size:22px;font-weight:600;letter-spacing:-.015em;margin:0}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:6px}
.hint{font-size:13px;color:var(--muted);margin:0}
.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.err{color:var(--bad)}

/* hero */
.hero{position:relative;overflow:hidden;width:100%;border:0;text-align:left;background:var(--lav);color:var(--on-pastel);border-radius:var(--r-xl);padding:22px 20px 20px;min-height:178px;display:block}
.hero-txt{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;max-width:64%}
.hero-txt strong{font-size:31px;line-height:1.02;font-weight:700;letter-spacing:-.03em;display:block}
.hero-txt span.p{font-size:13px;font-weight:500;display:block}
.bubbles{display:flex;margin-top:6px}
.bubbles i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:11.5px;letter-spacing:-.02em;border:2.5px solid var(--lav);margin-left:-9px;color:var(--on-pastel)}
.bubbles i:first-child{margin-left:0}
.bubbles .more{background:#7e6be6;color:#fff}
.discs{position:absolute;right:-6px;top:4px;width:150px;height:170px;pointer-events:none}
.disc{position:absolute;width:88px;height:56px;border-radius:50%;background:radial-gradient(ellipse at 34% 28%,rgba(255,255,255,.75),rgba(255,255,255,0) 46%),var(--c);box-shadow:inset 0 -9px 14px rgba(0,0,0,.28),0 6px 12px rgba(30,20,60,.18)}

/* stats */
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.stat b{display:block;font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.bar{grid-column:1/-1;height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:999px;transition:width .3s}
.stats-foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.link{border:0;background:none;padding:0;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:9px 0 11px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.day .wd{font-size:13px;color:var(--muted)}
.day b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.day .dot{width:6px;height:6px;border-radius:50%;background:var(--ink)}
.day .dot.off{background:transparent}
.day.today{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.today .wd{color:var(--bg);opacity:.8}
.day.today .dot{background:var(--bg)}
.day.today .dot.off{background:transparent}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:var(--r-lg);padding:16px;text-align:left;color:var(--on-pastel);display:flex;flex-direction:column;gap:6px;min-height:128px;position:relative;overflow:hidden}
.tile.big{grid-row:span 2;min-height:268px}
.tile .pill{align-self:flex-start;background:rgba(255,255,255,.55);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600}
.tile .t{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.tile .d{font-size:13px;font-weight:500}
.tile .foot{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.tile .foot i{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.6);display:grid;place-items:center;font-style:normal}
.orange{background:var(--orange)} .blue{background:var(--blue)} .pink{background:var(--pink)} .green{background:var(--green)} .lavender{background:var(--lav)}

/* chips */
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -18px;padding-left:18px;padding-right:18px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.chip small{font-weight:500;color:var(--muted);margin-left:5px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.chip.c-der[aria-pressed="true"]{background:var(--der);border-color:var(--der);color:var(--on-pastel)}
.chip.c-die[aria-pressed="true"]{background:var(--die);border-color:var(--die);color:var(--on-pastel)}
.chip.c-das[aria-pressed="true"]{background:var(--das);border-color:var(--das);color:var(--on-pastel)}
.chip.act{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sugg{background:var(--surface)}

/* search */
.search-row{display:flex;gap:10px;align-items:center}
.search{flex:1;min-width:0;position:relative;display:block}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.search input{width:100%;height:52px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px 0 46px;font-size:16px;font-weight:500}
.search-row .round-btn{width:52px;height:52px}
.sug{display:flex;flex-direction:column;gap:8px}
.sug-chips{display:flex;flex-wrap:wrap;gap:7px}

/* segmented */
.seg{display:inline-flex;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* word list */
.list{background:var(--surface);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:12px 16px}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .de{font-size:16.5px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.row .sub{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.row .side{display:flex;gap:6px;align-items:center;flex:none}
.apill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;color:var(--on-pastel);margin-right:7px;vertical-align:2px;background:var(--line)}
.a-der{background:var(--der)} .a-die{background:var(--die)} .a-das{background:var(--das)} .a-pl{background:var(--pl)}
.g-der{background:var(--der)} .g-die{background:var(--die)} .g-das{background:var(--das)} .g-pl{background:var(--pl)}
.flag{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:999px;background:var(--mark);color:var(--on-mark);font-size:12px;font-weight:700;padding:0 7px}
.known{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg)}
.known svg{width:14px;height:14px}
.day-h{font-size:14px;font-weight:600;color:var(--muted);margin:6px 6px -6px;display:flex;justify-content:space-between}
.active-filter{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-radius:var(--r-md);padding:10px 14px;font-weight:600;font-size:14px}
.empty{background:var(--surface);border-radius:var(--r-lg);padding:24px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.mini-train{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini-train button{border:0;border-radius:var(--r-md);padding:11px 12px;text-align:left;color:var(--on-pastel);font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:1px}
.mini-train span{font-size:11.5px;font-weight:500;opacity:.85}

/* translator results */
.found{display:flex;flex-direction:column;gap:10px}
.found-item{border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:5px;background:var(--surface-2)}
.found-item.g-der,.found-item.g-die,.found-item.g-das,.found-item.g-pl{color:var(--on-pastel)}
.found-item .de{font-size:19px;font-weight:700;letter-spacing:-.01em}
.found-item .ex{font-size:13.5px;font-style:italic}
.found-item .vforms{font-size:13px}
.found-item .why{font-size:12.5px;background:rgba(255,255,255,.7);color:#3b2e00;border-radius:8px;padding:4px 9px;align-self:flex-start}
.found-item .actions .btn.ghost{background:rgba(255,255,255,.65);color:var(--on-pastel);border-color:transparent}
.done{font-size:14px;font-weight:700}

/* buttons, forms */
.btn{height:48px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);padding:0 20px;font-weight:600;font-size:15px;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.small{height:36px;padding:0 14px;font-size:13.5px}
.btn.danger{background:none;color:var(--bad);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.field input,.field select,.field textarea{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:12px 14px;font-size:16px;min-width:0;width:100%}
.field textarea{resize:vertical;line-height:1.55}
textarea.mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.segbig{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.segbig button{flex:1;border:0;background:none;border-radius:999px;padding:9px 4px;font-weight:700;color:var(--muted)}
.segbig button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.segbig button.der[aria-pressed="true"]{background:var(--der);color:var(--on-pastel)}
.segbig button.die[aria-pressed="true"]{background:var(--die);color:var(--on-pastel)}
.segbig button.das[aria-pressed="true"]{background:var(--das);color:var(--on-pastel)}
.segbig button.pl[aria-pressed="true"]{background:var(--pl);color:var(--on-pastel)}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.note-box{background:var(--mark);color:var(--on-mark);border-radius:var(--r-md);padding:12px 14px;font-size:14px}

/* sheets */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-in{max-width:540px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.sheet-head{display:flex;align-items:center;gap:12px}
.sheet-head h2{flex:1;margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em;min-width:0;overflow-wrap:anywhere}
.word-hero{border-radius:var(--r-xl);padding:22px 20px;display:flex;flex-direction:column;gap:6px;background:var(--surface);color:var(--on-pastel)}
.word-hero:not(.g-der):not(.g-die):not(.g-das):not(.g-pl){color:var(--ink)}
.word-hero .art{font-size:15px;font-weight:700;background:rgba(255,255,255,.6);border-radius:999px;padding:3px 12px;align-self:flex-start}
.word-hero .big{font-size:32px;font-weight:700;letter-spacing:-.025em;line-height:1.1;overflow-wrap:anywhere}
.word-hero .ru{font-size:18px;font-weight:500}
.word-hero .pl{font-size:14px;opacity:.8}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--bad);border-radius:var(--r-md);padding:10px 12px}

/* verbs */
.conj-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.conj-grid{grid-template-columns:1fr}}
.conj{background:var(--surface);border-radius:var(--r-md);padding:14px 16px;min-width:0}
.conj h3{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.conj table{border-collapse:collapse;width:100%}
.conj td{padding:3px 0;font-size:15px;vertical-align:top}
.conj td:first-child{color:var(--muted);width:6.5em;font-size:13.5px;padding-top:5px}
.conj td.f{font-weight:600}
.conj td.irr::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--orange);margin-left:7px;vertical-align:2px}
.legend{font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--orange);margin-right:6px;vertical-align:1px}
.formtable{width:100%;border-collapse:collapse}
.formtable th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:4px}
.formtable td{padding:3px}
.formtable td:first-child{font-size:13px;color:var(--muted);white-space:nowrap}
.formtable input{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;font-size:15px}
.scroll-x{overflow-x:auto}

/* grammar */
.rule-card{background:var(--surface);border:0;border-radius:var(--r-lg);padding:16px;text-align:left;width:100%;display:flex;flex-direction:column;gap:6px}
.rule-card h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.rule-card p{margin:0;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:2px 10px;white-space:nowrap}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.md{font-size:15.5px;line-height:1.6;background:var(--surface);border-radius:var(--r-lg);padding:4px 18px 12px}
.md h2{font-size:20px;font-weight:700;letter-spacing:-.015em;margin:18px 0 6px;text-wrap:balance}
.md h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.md p{margin:6px 0}
.md ul{margin:6px 0;padding-left:20px}
.md li{margin:3px 0}
.md code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.md .ex{background:var(--surface-2);padding:9px 13px;margin:8px 0;border-radius:var(--r-sm);font-style:italic}
.md .tw{overflow-x:auto;margin:10px 0;border-radius:var(--r-sm);border:1px solid var(--line)}
.md table{border-collapse:collapse;min-width:100%;font-variant-numeric:tabular-nums}
.md th,.md td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;white-space:nowrap;font-size:14.5px}
.md th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.md tr:last-child td{border-bottom:0}
.md .m{background:var(--der)} .md .f{background:var(--die)} .md .n{background:var(--das)} .md .p{background:var(--pl)}
.md .m,.md .f,.md .n,.md .p{color:var(--on-pastel);font-weight:700;border-radius:6px;padding:0 5px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div class="app">
  <header class="hdr">
    <button class="round-btn avatar" id="btn-data" aria-label="Данные и резервная копия">K</button>
    <div class="hdr-mid"><b id="hdr-t">Hallo, Katarina</b><span id="hdr-s"></span></div>
    <button class="round-btn" id="btn-search" aria-label="Поиск слов"></button>
  </header>
  <main id="view" class="stack"></main>
</div>
<nav class="nav" aria-label="Разделы">
  <button data-tab="home" aria-label="Главная"></button>
  <button data-tab="words" aria-label="Словарь"></button>
  <button data-tab="verbs" aria-label="Глаголы"></button>
  <button data-tab="rules" aria-label="Грамматика"></button>
</nav>
<datalist id="dl-topics"></datalist>
<div id="sheets"></div>
<div id="toast" class="toast" hidden></div>

<script src="seed.js"></script>
<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ß/g,"ss");
const ARTS = ["der","die","das"];
const PERS = ["ich","du","er/sie/es","wir","ihr","sie/Sie"];
const POS = {n:"существительное", v:"глагол", adj:"прилагательное", adv:"наречие", phr:"выражение", other:"другое"};
const IC = (p, w=1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON = {
  home: IC('<path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/>'),
  words: IC('<rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/>'),
  verbs: IC('<path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.8" cy="6.5" r="1.1"/><circle cx="4.8" cy="12" r="1.1"/><circle cx="4.8" cy="17.5" r="1.1"/>'),
  rules: IC('<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/>'),
  search: IC('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>', 2),
  back: IC('<path d="M15 5l-7 7 7 7"/>', 2.2),
  plus: IC('<path d="M12 5v14M5 12h14"/>', 2.2),
  check: IC('<path d="m5 12.5 4.5 4.5L19 7.5"/>', 3),
  arrow: IC('<path d="M5 12h14M13 6l6 6-6 6"/>', 2),
};
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2400); }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }

/* ---------- storage: this device only ---------- */
const COLLS = ["words","verbs","rules"];
const S = { words:new Map(), verbs:new Map(), rules:new Map() };
const LS_KEY = "heft-local";
function loadLocal(){
  const d = lsGet(LS_KEY);
  if (!d) return false;
  for (const c of COLLS) S[c] = new Map((d[c]||[]).map(x=>[x.id,x]));
  return true;
}
function persistLocal(){
  const out = {}; for (const c of COLLS) out[c] = [...S[c].values()];
  try { localStorage.setItem(LS_KEY, JSON.stringify(out)); return true; }
  catch { toast("Не удалось сохранить на устройстве. Сделай резервную копию"); return false; }
}
/* Older words have no topic yet: derive one from where they came from. */
const SRC_TOPIC = [[/реклам/i,"Реклама"],[/професси/i,"Профессии"],[/подработк/i,"Подработки"],[/работа/i,"Работа"],[/заявлен|bewerbung/i,"Bewerbung"],[/гороскоп/i,"Гороскоп"],[/вещи/i,"Вещи и покупки"],[/отношени/i,"Отношения"],[/разговор/i,"Повседневное"],[/07\.10/,"Разное"]];
function topicFromSrc(src){ for (const [re,t] of SRC_TOPIC) if (re.test(src||"")) return t; return ""; }
function migrate(){
  let n = 0;
  for (const w of S.words.values()) {
    if (w.topic === undefined) { w.topic = topicFromSrc(w.src); n++; }
    if (!w.added) { w.added = w.updated || Date.now(); n++; }
  }
  if (n) persistLocal();
}
function initStore(){
  if (!loadLocal() && window.HEFT_SEED) {
    for (const c of COLLS) S[c] = new Map((window.HEFT_SEED[c]||[]).map(x=>[x.id,x]));
  }
  migrate();
  persistLocal();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  render();
}
function put(c, obj){ const data = {...obj, updated:Date.now()}; S[c].set(obj.id, data); }
async function save(c, obj){ put(c, obj); persistLocal(); scheduleRender(); }
function saveMany(c, objs){ objs.forEach(o=>put(c,o)); persistLocal(); scheduleRender(); }
async function del(c, id){ S[c].delete(id); persistLocal(); scheduleRender(); }

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
function dayKey(ts){ const d = new Date(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function keyDate(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d, 12); }
function dayLabel(k){
  const today = dayKey(Date.now()), yest = dayKey(Date.now()-864e5);
  if (k===today) return "Сегодня";
  if (k===yest) return "Вчера";
  const d = keyDate(k);
  return d.toLocaleDateString("ru-RU", d.getFullYear()===new Date().getFullYear() ? {day:"numeric", month:"long"} : {day:"numeric", month:"long", year:"numeric"});
}

/* ---------- verb forms ---------- */
const INSEP = /^(be|ge|er|ver|zer|ent|emp|miss|über|unter|hinter|wider)/;
function weakForms(inf, sep=""){
  const b = sep && inf.startsWith(sep) ? inf.slice(sep.length) : inf;
  let stem, sp = "";
  if (b.endsWith("eln")) { stem=b.slice(0,-1); sp="eln"; }
  else if (b.endsWith("ern")) { stem=b.slice(0,-1); sp="ern"; }
  else if (b.endsWith("en")) stem=b.slice(0,-2);
  else if (b.endsWith("n")) stem=b.slice(0,-1);
  else stem=b;
  const needE = !sp && (/[td]$/.test(stem) || /[^aeiouäöülrhmn][mn]$/.test(stem));
  const sib = /(s|ß|z|x)$/.test(stem);
  const e = needE ? "e" : "";
  let pr = sp==="eln" ? [stem.slice(0,-2)+"le", stem+"st", stem+"t", b, stem+"t", b]
         : sp==="ern" ? [stem+"e", stem+"st", stem+"t", b, stem+"t", b]
         : [stem+"e", stem+(sib ? "t" : e+"st"), stem+e+"t", b, stem+e+"t", b];
  const t = stem+e+"te";
  let pt = [t, t+"st", t, t+"n", t+"t", t+"n"];
  if (sep) { pr = pr.map(x=>x+" "+sep); pt = pt.map(x=>x+" "+sep); }
  const insep = INSEP.test(b) || /ieren$/.test(b);
  return { praes:pr, praet:pt, p2:(sep||"")+(insep?"":"ge")+stem+e+"t" };
}
const AUX = { haben:["habe","hast","hat","haben","habt","haben"], sein:["bin","bist","ist","sind","seid","sind"] };
const WUERDE = ["würde","würdest","würde","würden","würdet","würden"];
function k2Forms(v){ return (v.k2 && v.k2.some(Boolean)) ? v.k2 : WUERDE.map(w=>w+" "+v.inf); }

/* ---------- word helpers ---------- */
function findWord(w){ const k = norm(w); return [...S.words.values()].find(x => norm(x.w) === k); }
function findVerb(inf){ const k = norm(inf); return [...S.verbs.values()].find(x => norm(x.inf) === k); }
function firstArt(w){ return (w.art||"").split("/")[0]; }
function gClass(w){ const a = firstArt(w); return a==="der"||a==="die"||a==="das" ? "g-"+a : a==="pl" ? "g-pl" : ""; }
function apill(w){
  if (!w.art) return "";
  if (w.art==="pl") return `<span class="apill a-pl">die · мн.</span>`;
  return `<span class="apill a-${firstArt(w)}">${esc(w.art)}</span>`;
}
function artText(w){ return !w.art ? "" : (w.art==="pl" ? "die " : w.art+" "); }
function plText(w){
  if (w.pos!=="n") return "";
  if (w.art==="pl") return "только мн. ч.";
  if (!w.pl) return "";
  if (w.pl==="—") return "без мн. ч.";
  return "мн.: die " + w.pl;
}
function topicsList(){
  const m = new Map();
  for (const w of S.words.values()) { const t = (w.topic||"").trim(); if (t) m.set(t, (m.get(t)||0)+1); }
  return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],"ru")).map(([t,n])=>({t,n}));
}
const knownIn = list => list.filter(w=>w.known).length;
function poolFor(topic){
  const all = [...S.words.values()];
  if (!topic) return all;
  if (topic==="__none") return all.filter(w=>!(w.topic||"").trim());
  return all.filter(w=>(w.topic||"").trim()===topic);
}
const topicLabel = t => !t ? "Все темы" : t==="__none" ? "Без темы" : t;

/* ---------- state ---------- */
const st = {
  tab: lsGet("heft-tab") || "home", q:"", filter:"all", topic:"", sort:"date", day:"", vq:"", rq:"",
  homeTopic: lsGet("heft-home-topic") || "", trTopic: lsGet("heft-tr-topic") || "",
  sug:{q:"", wiki:[], busy:false}, tr:{busy:false, err:"", items:[]}
};
if (!["home","words","verbs","rules"].includes(st.tab)) st.tab = "home";
let rT; function scheduleRender(){ cancelAnimationFrame(rT); rT=requestAnimationFrame(render); }

function render(){
  renderHeader();
  document.querySelectorAll(".nav button").forEach(b => { if (b.dataset.tab===st.tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  const v = $("#view");
  const ae = document.activeElement, keep = ae && v.contains(ae) && ae.id, pos = keep && ae.selectionStart;
  if (st.tab==="home") v.innerHTML = viewHome();
  else if (st.tab==="words") { v.innerHTML = viewWords(); fillWords(); fillTr(); }
  else if (st.tab==="verbs") { v.innerHTML = viewVerbs(); fillVerbs(); }
  else { v.innerHTML = viewRules(); fillRules(); }
  if (keep) { const el = document.getElementById(keep); if (el) { el.focus(); try{ el.setSelectionRange(pos,pos); }catch{} } }
  $("#dl-topics").innerHTML = topicsList().map(t=>`<option value="${esc(t.t)}">`).join("");
  refreshOpenSheet();
}
function renderHeader(){
  const all = [...S.words.values()];
  let t, s;
  if (st.tab==="home") { t = "Hallo, Katarina"; s = "Heute · " + new Date().toLocaleDateString("de-DE",{weekday:"long", day:"numeric", month:"long"}); }
  else if (st.tab==="words") { t = "Wörter"; s = `${all.length} слов · ${knownIn(all)} выучено`; }
  else if (st.tab==="verbs") { t = "Verben"; s = `${S.verbs.size} глаголов`; }
  else { t = "Grammatik"; s = `${S.rules.size} правил`; }
  $("#hdr-t").textContent = t; $("#hdr-s").textContent = s;
}

/* ---------- home ---------- */
function viewHome(){
  const all = [...S.words.values()];
  const total = all.length, known = knownIn(all), check = all.filter(w=>w.check).length;
  const pct = total ? Math.round(known/total*100) : 0;
  const counts = {}; all.forEach(w => { const k = dayKey(w.added||0); counts[k] = (counts[k]||0)+1; });
  const todayK = dayKey(Date.now());
  const days = []; for (let i=6;i>=0;i--){ const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-i); days.push(d); }
  const pool = poolFor(st.homeTopic);
  const nouns = pool.filter(w=>w.pos==="n" && ARTS.includes(w.art)).length;
  const tl = topicsList();
  const noneN = poolFor("__none").length;
  const chip = (id, label, n) => `<button class="chip" data-htopic="${esc(id)}" aria-pressed="${st.homeTopic===id}">${esc(label)}${n!=null?`<small>${n}</small>`:""}</button>`;
  const discs = [["#7fb2ff",44,0,-14],["#f1eee6",56,22,8],["#ff8f4d",36,52,-6],["#f27aa8",12,70,10],["#2a2f45",44,92,-10],["#e9e5df",62,104,6],["#3f7a62",30,128,-4]]
    .map(([c,x,y,r]) => `<i class="disc" style="--c:${c};left:${x}px;top:${y}px;transform:rotate(${r}deg)"></i>`).join("");
  const todayN = counts[todayK]||0;
  return `
  <button class="hero" data-act="write">
    <span class="discs" aria-hidden="true">${discs}</span>
    <span class="hero-txt">
      <strong>Schreib-<br>Challenge</strong>
      <span class="p">5 слов по-русски → твой текст на немецком → проверка ошибок</span>
      <span class="bubbles"><i class="a-der">der</i><i class="a-die">die</i><i class="a-das">das</i><i class="more">+5</i></span>
    </span>
  </button>

  <section class="card stats" aria-label="Статистика">
    <div class="stat"><b>${total}</b><span>слов в тетради</span></div>
    <div class="stat"><b>${known}</b><span>выучено</span></div>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div class="stats-foot"><span>${pct}% выучено · ${todayN ? "сегодня +"+todayN : "сегодня новых нет"}</span>${check?`<button class="link" data-act="go-check">${check} проверить</button>`:""}</div>
  </section>

  <div class="sec-row"><h2 class="sec">Неделя</h2><span class="hint">${new Date().toLocaleDateString("de-DE",{month:"long", year:"numeric"})}</span></div>
  <div class="week">${days.map(d => { const k = dayKey(d), n = counts[k]||0;
    return `<button class="day ${k===todayK?"today":""}" data-day="${k}" aria-label="${esc(dayLabel(k))}: ${n} слов"><i class="dot ${n?"":"off"}"></i><span class="wd">${d.toLocaleDateString("de-DE",{weekday:"short"}).replace(".","")}</span><b>${d.getDate()}</b></button>`; }).join("")}</div>
  <p class="hint">Точка = в этот день добавлены слова. Нажми на день, чтобы увидеть их.</p>

  <div class="sec-row"><h2 class="sec">Тренировка</h2><span class="hint">${knownIn(pool)} из ${pool.length} выучено</span></div>
  <div class="chips">${chip("","Все темы",total)}${tl.map(t=>chip(t.t,t.t,t.n)).join("")}${noneN?chip("__none","Без темы",noneN):""}</div>
  <div class="tiles">
    <button class="tile orange big" data-train="cards" data-src="home">
      <span class="pill">${Math.min(20,pool.length)} карточек</span>
      <span class="t">Karteikarten</span>
      <span class="d">Слово → перевод. «Знаю» отмечает слово выученным.</span>
      <span class="foot"><i>${ICON.arrow}</i>${esc(topicLabel(st.homeTopic))}</span>
    </button>
    <button class="tile blue" data-train="article" data-src="home">
      <span class="pill">${nouns} сущ.</span>
      <span class="t">der · die · das</span>
      <span class="d">угадай артикль</span>
    </button>
    <button class="tile pink" data-train="translate" data-src="home">
      <span class="pill">тест</span>
      <span class="t">Перевод</span>
      <span class="d">выбери немецкое слово</span>
    </button>
  </div>`;
}

/* ---------- words ---------- */
function wordsFiltered(){
  const q = norm(st.q.trim());
  let list = poolFor(st.topic);
  const f = st.filter;
  if (f==="check") list = list.filter(w=>w.check);
  else if (f==="known") list = list.filter(w=>w.known);
  else if (f==="learn") list = list.filter(w=>!w.known);
  else if (ARTS.includes(f)) list = list.filter(w=>(w.art||"").split("/").includes(f));
  else if (f==="other") list = list.filter(w=>w.pos!=="n");
  if (st.day) list = list.filter(w=>dayKey(w.added||0)===st.day);
  if (q) {
    const scored = [];
    for (const w of list) {
      const nw = norm(w.w), nr = norm(w.ru);
      let s = -1;
      if (nw.startsWith(q)) s = 0;
      else if (nr.split(/[,;\s]+/).some(x=>x.startsWith(q))) s = 1;
      else if (nw.includes(q)) s = 2;
      else if (nr.includes(q) || norm(w.pl).includes(q) || norm(w.note).includes(q)) s = 3;
      if (s >= 0) scored.push([s, w]);
    }
    return scored.sort((a,b)=>a[0]-b[0] || a[1].w.length-b[1].w.length).map(x=>x[1]);
  }
  if (st.sort==="alpha") return list.sort((a,b)=>norm(a.w).localeCompare(norm(b.w),"de"));
  return list.sort((a,b)=>(b.added||0)-(a.added||0));
}
function viewWords(){
  const tl = topicsList(), noneN = poolFor("__none").length;
  const fc = (id,label,cls="") => `<button class="chip ${cls}" data-filter="${id}" aria-pressed="${st.filter===id}">${label}</button>`;

/* ---------- live suggestions (Wiktionary prefix search) ---------- */
const WIKI = "https://de.wiktionary.org/w/api.php";
let sugT = null, sugCtl = null;
function scheduleSug(){
  clearTimeout(sugT);
  const q = st.q.trim();
  if (q.length < 2 || /[а-яё]/i.test(q) || q.includes(",")) { st.sug = {q, wiki:[], busy:false}; fillSug(); return; }
  st.sug = {q, wiki: st.sug.q && q.startsWith(st.sug.q) ? st.sug.wiki.filter(t=>norm(t).startsWith(norm(q))) : [], busy:true};
  fillSug();
  sugT = setTimeout(() => fetchSug(q), 220);
}
async function fetchSug(q){
  if (navigator.onLine === false) { st.sug.busy = false; fillSug(); return; }
  if (sugCtl) sugCtl.abort();
  sugCtl = new AbortController();
  const vars = [...new Set([q, q[0].toUpperCase()+q.slice(1), q[0].toLowerCase()+q.slice(1)])];
  try {
    const res = await Promise.all(vars.map(v => fetch(WIKI+"?action=opensearch&format=json&namespace=0&limit=8&origin=*&search="+encodeURIComponent(v), {signal:sugCtl.signal})
      .then(r => r.ok ? r.json() : [null,[]]).catch(e => { if (e && e.name==="AbortError") throw e; return [null,[]]; })));
    const seen = new Set(); const titles = [];
    res.forEach(r => (r[1]||[]).forEach(t => { const k = t.toLowerCase(); if (!seen.has(k) && !/[:()]/.test(t) && t.split(" ").length <= 3) { seen.add(k); titles.push(t); } }));
    titles.sort((a,b) => (norm(a)===norm(q) ? -1 : 0) - (norm(b)===norm(q) ? -1 : 0) || a.length - b.length);
    if (st.q.trim() === q) { st.sug = {q, wiki:titles.slice(0,8), busy:false}; fillSug(); }
  } catch (e) { if (!(e && e.name==="AbortError")) { st.sug.busy = false; fillSug(); } }
}
function fillSug(){
  const el = $("#sug"); if (!el) return;
  const q = st.q.trim();
  if (q.length < 2) { el.innerHTML = ""; return; }
  const ru = /[а-яё]/i.test(q);
  const chips = [];
  if (q.includes(",")) {
    const n = q.split(/[,;]+/).map(s=>s.trim()).filter(Boolean).length;
    chips.push(`<button class="chip act" data-act="lookup-all">Перевести все (${n})</button>`);
  } else if (ru) {
    chips.push(`<button class="chip act" data-act="lookup" data-term="${esc(q)}">Перевести «${esc(q)}» на немецкий</button>`);
  } else {
    const wiki = st.sug.q === q || q.startsWith(st.sug.q) ? st.sug.wiki : [];
    wiki.forEach(t => { const have = findWord(t); chips.push(`<button class="chip ${have?"":"sugg"}" data-act="${have?"open-word":"lookup"}" data-term="${esc(t)}">${esc(t)}${have?"<small>в словаре</small>":""}</button>`); });
    if (!findWord(q) && !wiki.some(t => norm(t)===norm(q))) chips.push(`<button class="chip act" data-act="lookup" data-term="${esc(q)}">Найти «${esc(q)}»</button>`);
  }
  if (!chips.length) { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="sug"><span class="lbl">${ru ? "Новое слово" : st.sug.busy ? "Ищу подсказки…" : "Подсказки · нажми, чтобы найти и сохранить"}</span><div class="sug-chips">${chips.join("")}</div></div>`;
}

/* ---------- dictionary lookup: Wiktionary + MyMemory, both free, no key ---------- */
async function wikiText(title, signal){
  const u = WIKI + "?action=parse&prop=wikitext&format=json&formatversion=2&redirects=1&origin=*&page=" + encodeURIComponent(title);
  const r = await fetch(u, {signal});
  if (!r.ok) return null;
  const j = await r.json();
  return (j && j.parse && j.parse.wikitext) || null;
}
async function myMemory(q, pair, signal){
  try {
    const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(q) + "&langpair=" + pair, {signal});
    if (!r.ok) return "";
    const j = await r.json();
    const t = j && j.responseData && j.responseData.translatedText || "";
    return /MYMEMORY WARNING|INVALID/i.test(t) ? "" : t.trim();
  } catch(e) { if (e && e.name==="AbortError") throw e; return ""; }
}
function germanSection(t){
  const m = t.match(/^==[^=].*\{\{Sprache\|Deutsch\}\}.*$/m);
  if (!m) return null;
  const rest = t.slice(m.index + m[0].length);
  const next = rest.search(/^==[^=]/m);
  return next === -1 ? rest : rest.slice(0, next);
}
function tplParams(sec, name){
  const i = sec.indexOf("{{" + name); if (i < 0) return null;
  let depth = 0, j = i;
  for (; j < sec.length - 1; j++) {
    if (sec[j]==="{" && sec[j+1]==="{") { depth++; j++; }
    else if (sec[j]==="}" && sec[j+1]==="}") { depth--; j++; if (depth===0) break; }
  }
  const p = {};
  sec.slice(i+2, j-1).split(/\n\s*\|/).slice(1).forEach(x => { const k = x.indexOf("="); if (k > 0) p[x.slice(0,k).trim()] = cleanWiki(x.slice(k+1)); });
  return p;
}
function cleanWiki(v){
  return String(v||"").replace(/<ref[^>]*\/>/g,"").replace(/<ref[\s\S]*?<\/ref>/g,"").replace(/<[^>]+>/g,"")
    .replace(/\{\{[^{}]*\}\}/g,"").replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g,"$1").replace(/'{2,}/g,"").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim();
}
const REFL = new Set(["mich","dich","sich","uns","euch"]);
function stripRefl(f){ return f.split(" ").filter(x => !REFL.has(x)).join(" "); }
function praetForms(p){
  if (p.endsWith("e")) return [p, p+"st", p, p+"n", p+"t", p+"n"];
  return [p, p+(/[sßzxtd]$/.test(p)?"est":"st"), p, p+"en", p+(/[td]$/.test(p)?"et":"t"), p+"en"];
}
function parseEntry(title, wt){
  const sec = germanSection(wt); if (!sec) return null;
  const base = sec.match(/\{\{Grundformverweis[^|}]*\|([^}|]+)/);
  const wa = (sec.match(/\{\{Wortart\|([^|}]+)\|Deutsch\}\}/) || [])[1] || "";
  if (base && !/Substantiv|Verb|Adjektiv|Adverb/.test(wa)) return {redirect: base[1].trim()};
  const pos = /Substantiv|Eigenname/.test(wa) ? "n" : /Verb/.test(wa) ? "v" : /Adjektiv|Partizip/.test(wa) ? "adj" : /Adverb/.test(wa) ? "adv" : /Redewendung|Wortverbindung/.test(wa) ? "phr" : "other";
  const it = { w:title, art:"", pl:"", pos, ru:"", note:"", check:false, checkNote:"" };
  const ru = []; const re = /\{\{Ü\|ru\|([^}|]+)(?:\|([^}]+))?\}\}/g; let m;
  while ((m = re.exec(sec)) && ru.length < 4) { const v = (m[2] || m[1]).normalize("NFD").replace(/\u0301/g,"").normalize("NFC").trim(); if (v && !ru.includes(v)) ru.push(v); }
  it.ru = ru.join(", ");
  const ex = sec.match(/\{\{Beispiele\}\}\s*\n:\s*(?:\[[^\]]*\])?\s*(.+)/);
  if (ex) { const e = cleanWiki(ex[1]); if (e.length > 3 && e.length < 160) it.note = e; }
  if (pos === "n") {
    const p = tplParams(sec, "Deutsch Substantiv Übersicht") || {};
    const g = [p["Genus"], p["Genus 1"], p["Genus 2"]].filter(Boolean);
    const arts = [...new Set(g.map(x => ({m:"der", f:"die", n:"das"})[x]).filter(Boolean))];
    const sg = p["Nominativ Singular"] || p["Nominativ Singular 1"] || "";
    if (/^[—–-]$/.test(sg) || g.includes("0") || (!arts.length && /Pluraletantum|pl\./i.test(wa))) it.art = "pl";
    else it.art = arts.join("/");
    const pl = p["Nominativ Plural"] || p["Nominativ Plural 1"] || "";
    it.pl = it.art === "pl" ? title : (!pl || /^[—–-]$/.test(pl) ? "—" : pl);
    if (!it.art) { it.check = true; it.checkNote = "род не найден"; }
  }
  if (pos === "v") {
    const p = tplParams(sec, "Deutsch Verb Übersicht") || {};
    const ich = stripRefl(p["Präsens_ich"] || ""), du = stripRefl(p["Präsens_du"] || ""), er = stripRefl(p["Präsens_er, sie, es"] || "");
    const pt = stripRefl(p["Präteritum_ich"] || "");
    if (ich && er && pt && p["Partizip II"]) {
      const parts = ich.split(" "); const sep = parts.length > 1 ? parts[parts.length-1] : "";
      const core = title.startsWith(sep) ? title.slice(sep.length) : title;
      const add = x => sep ? x + " " + sep : x;
      const wf = weakForms(title, sep);
      const ptCore = pt.split(" ")[0];
      const praet = praetForms(ptCore).map(add);
      const aux = /sein/.test(p["Hilfsverb"]||"") && !/haben/.test(p["Hilfsverb"]||"") ? "sein" : "haben";
      it.verb = { praes:[ich, du, er, add(core), wf.praes[4], add(core)], praet, p2:p["Partizip II"].split(/[,;]/)[0].trim(), aux,
                  strong: praet[0] !== wf.praet[0] || p["Partizip II"].indexOf(wf.p2) !== 0, sep, k2:null };
      if (/sein/.test(p["Hilfsverb"]||"") && /haben/.test(p["Hilfsverb"]||"")) it.note = (it.note ? it.note + " · " : "") + "Perfekt с haben и с sein";
    }

}
async function lookup(term, signal){
  let t = term.trim().replace(/\s+/g," ");
  let refl = false, fromRu = "";
  if (/[а-яё]/i.test(t)) {

    const de = await myMemory(t, "ru|de", signal);
    if (!de) return { input:term, w:t, art:"", pl:"", pos:"other", ru:t, note:"", check:true, checkNote:"автопереводчик не ответил, впиши немецкое слово сама" };
    t = de.replace(/[.!?]$/,"");
  }
  const am = t.match(/^(der|die|das)\s+(.+)$/i); if (am) t = am[2];
  if (/^sich\s+/i.test(t)) { refl = true; t = t.replace(/^sich\s+/i,""); }
  const tries = [...new Set([t, t[0].toUpperCase()+t.slice(1), t[0].toLowerCase()+t.slice(1)])];
  let it = null;
  for (let title of tries) {
    let wt = await wikiText(title, signal); if (!wt) continue;
    let e = parseEntry(title, wt);
    if (e && e.redirect) { title = e.redirect; wt = await wikiText(title, signal); e = wt ? parseEntry(title, wt) : null; }
    if (e && !e.redirect) { it = e; break; }
  }
  if (!it) {
    const ru = fromRu || await myMemory(t, "de|ru", signal);
    return { input:term, w:t, art:"", pl:"", pos: /\s/.test(t) ? "phr" : "other", ru, note:"", check:true, checkNote:"в Викисловаре не нашлось: артикль и формы впиши сама" };
  }
  it.input = term;
  if (refl) it.note = "sich " + it.w + (it.note ? " · " + it.note : "");
  if (fromRu) { it.check = true; it.checkNote = "немецкое слово подобрал автопереводчик, проверь значение"; if (!it.ru) it.ru = fromRu; }
  if (!it.ru) { it.ru = await myMemory(it.w, "de|ru", signal); it.check = true; it.checkNote = it.checkNote || "перевод из автопереводчика"; }

}
let trCtl = null;
async function runLookup(terms){
  terms = terms.map(s=>s.trim()).filter(Boolean).slice(0, 15);
  if (!terms.length) return;
  if (navigator.onLine === false) { st.tr.err = "Нет интернета. Поиск новых слов работает только онлайн, словарь и тренировки доступны всегда."; fillTr(); return; }
  st.tr.busy = true; st.tr.err = ""; st.q = ""; st.sug = {q:"", wiki:[], busy:false};
  const qi = $("#q"); if (qi) qi.value = "";
  fillWords(); fillTr();
  if (trCtl) trCtl.abort();
  trCtl = new AbortController();
  const found = [];
  try {
    for (const term of terms) found.push(await lookup(term, trCtl.signal));
    st.tr.items = [...found, ...st.tr.items.filter(x => !x._saved)].slice(0, 20);
  } catch (e) {
    if (!(e && e.name==="AbortError")) st.tr.err = "Не получилось связаться со словарём. Проверь интернет и попробуй ещё раз.";

}

  const list = [...S.rules.values()].filter(r=>!q || norm(r.title).includes(q) || norm(r.body).includes(q) || (r.tags||[]).some(t=>norm(t).includes(q)))
    .sort((a,b)=>(a.order??999)-(b.order??999) || norm(a.title).localeCompare(norm(b.title)));
  if (!S.rules.size) { el.innerHTML = `<div class="empty"><strong>Пока пусто</strong>Добавь своё первое правило кнопкой «+».</div>`; return; }
  if (!list.length) { el.innerHTML = `<div class="empty">Ничего не нашлось.</div>`; return; }
  const colors = ["lav","orange","blue","pink","green"];
  el.innerHTML = list.map((r,i)=>`<button class="rule-card" data-rule="${esc(r.id)}"><span class="tags"><span class="tag" style="background:var(--${colors[i%colors.length]});color:var(--on-pastel)">${esc((r.tags||[])[0]||"правило")}</span>${r.check?'<span class="flag">проверить</span>':""}</span><h3>${esc(r.title)}</h3>
      <p>${esc(plainOf(r.body).slice(0,180))}</p></button>`).join("");
}

/* ---------- mini markdown for rules ---------- */
function inline(s){
  return esc(s)
    .replace(/\{(m|f|n|p):([^}]*)\}/g,'<span class="$1">$2</span>')
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/==([^=]+)==/g,"<mark>$1</mark>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>")
    .replace(/`([^`]+)`/g,"<code>$1</code>");
}
function md(src){
  const lines = String(src||"").replace(/\r/g,"").split("\n");
  let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*$/.test(l)) { i++; continue; }
    if (/^### /.test(l)) { out += `<h3>${inline(l.slice(4))}</h3>`; i++; continue; }
    if (/^## /.test(l)) { out += `<h2>${inline(l.slice(3))}</h2>`; i++; continue; }
    if (/^# /.test(l)) { out += `<h2>${inline(l.slice(2))}</h2>`; i++; continue; }
    if (/^\s*\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const body = rows.filter(r=>!/^\s*\|[\s:\-|]+\|\s*$/.test(r));
      const [head, ...rest] = body;
      out += `<div class="tw"><table><thead><tr>${cells(head).map(c=>`<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>` +
        rest.map(r=>`<tr>${cells(r).map(c=>`<td>${inline(c)}</td>`).join("")}</tr>`).join("") + `</tbody></table></div>`;
      continue;
    }
    if (/^\s*[-•] /.test(l)) {
      out += "<ul>";
      while (i < lines.length && /^\s*[-•] /.test(lines[i])) { out += `<li>${inline(lines[i].replace(/^\s*[-•] /,""))}</li>`; i++; }
      out += "</ul>"; continue;
    }
    if (/^> ?/.test(l)) {
      const ex = [];
      while (i < lines.length && /^> ?/.test(lines[i])) { ex.push(inline(lines[i].replace(/^> ?/,""))); i++; }
      out += `<div class="ex">${ex.join("<br>")}</div>`; continue;
    }
    const p = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|\s*\||\s*[-•] |> ?)/.test(lines[i])) { p.push(inline(lines[i])); i++; }
    out += `<p>${p.join("<br>")}</p>`;
  }
  return out;
}

      <div class="md">${md(r.body)}</div>
      ${(r.tags||[]).length?`<div class="tags">${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`:""}
      <div class="actions">${r.check?`<button class="btn" data-act="confirm-rule">Всё верно</button>`:""}<button class="btn ghost" data-act="edit-rule">Редактировать</button><span class="grow"></span><button class="btn danger" data-act="del-rule">Удалить</button></div>

}

function parseQuick(str){
  const out = {};
  let s = str.trim(); if (!s) return out;
  const parts = s.split(/\s+[—–-]\s+|\s*=\s*/);
  let de = parts[0]; if (parts.length>1) out.ru = parts.slice(1).join(" — ").trim();
  const m = de.match(/^(der|die|das|r|e|s)\s+(.+)$/i);
  if (m) { out.art = ({r:"der",e:"die",s:"das"})[m[1].toLowerCase()] || m[1].toLowerCase(); de = m[2]; out.pos="n"; }
  const [word, pl] = de.split(/\s*,\s*/);
  out.w = word.trim();
  if (pl !== undefined) {
    const p = pl.trim();
    if (p==="-" || p==="–") out.pl = out.w;
    else if (/^-?$|^—$|^x$/i.test(p)) out.pl = "—";
    else if (/^-/.test(p)) out.pl = out.w + p.slice(1);
    else out.pl = p;
  }
  if (!m && /^[a-zäöüß]/.test(out.w)) out.pos = /en$|ern$|eln$/.test(out.w) ? "v" : "adj";
  return out;
}

/* ---------- training ---------- */
function startTrain(kind, src){
  let pool = src==="list" ? wordsFiltered() : poolFor(st.homeTopic);
  const label = src==="list" ? "этот список" : topicLabel(st.homeTopic);
  if (kind==="article") pool = pool.filter(w=>w.pos==="n" && ARTS.includes(w.art));
  if (kind==="translate") pool = pool.filter(w=>w.ru);
  if (pool.length < (kind==="translate"?4:1)) { toast(kind==="translate" ? "Для теста нужно хотя бы 4 слова" : "Здесь нет подходящих слов"); return; }
  if (kind==="cards") { const fresh = pool.filter(w=>!w.known); if (fresh.length >= 5) pool = fresh; }
  pool = shuffle(pool).sort((a,b)=>(a.box||0)-(b.box||0)).slice(0,20);
  pool = shuffle(pool);
  const titles = {cards:"Karteikarten", article:"der, die или das?", translate:"Тест на перевод"};
  openSheet({kind:"train", mode:kind, title:titles[kind], label, deck:pool.map(w=>w.id), i:0, right:0, wrong:[], learned:0, flipped:false, answered:null, dir:"de"});
}
function trainBody(s){
  const n = s.deck.length;
  if (s.i >= n) {
    return `<div class="card stack" style="align-items:center;text-align:center;gap:10px">
      <span class="lbl">${esc(s.label)}</span>
      <div class="score">${s.right} / ${n}</div>
      ${s.mode==="cards" ? `<p class="hint">Отмечено выученными: ${s.learned}. Всего выучено: ${knownIn([...S.words.values()])} из ${S.words.size}.</p>` : ""}
      <p class="hint">${s.wrong.length ? "Повторить: "+s.wrong.map(id=>esc((S.words.get(id)||{}).w||"")).join(", ") : "Без ошибок."}</p></div>
      <div class="actions">${s.wrong.length?`<button class="btn" data-act="redo-wrong">Повторить ошибки</button>`:""}<button class="btn ghost" data-act="train-again">Ещё раз</button><button class="btn ghost" data-act="close">Готово</button></div>`;
  }
  const w = S.words.get(s.deck[s.i]);
  if (!w) { s.i++; return trainBody(s); }
  const prog = `<div class="progress" aria-label="Прогресс"><i style="width:${(s.i/n)*100}%"></i></div><div class="meta"><span>${s.i+1} из ${n} · ${esc(s.label)}</span><span>верно: ${s.right}</span></div>`;
  if (s.mode==="cards") {
    const de = `<span class="de">${esc(artText(w))}${esc(w.w)}</span>`, ru = `<span class="ru">${esc(w.ru)}</span>`;
    return `${prog}
      <div class="seg" style="align-self:center"><button data-act="dir-de" aria-pressed="${s.dir==="de"}">DE → RU</button><button data-act="dir-ru" aria-pressed="${s.dir==="ru"}">RU → DE</button></div>
      <button class="flash ${s.flipped?gClass(w):""}" data-act="flip">${s.dir==="de"?de:ru}${s.flipped ? (s.dir==="de"?ru:de) + (plText(w)?`<span class="hint">${esc(plText(w))}</span>`:"") : `<span class="hint">нажми, чтобы перевернуть</span>`}</button>
      ${s.flipped?`<div class="two"><button class="btn ghost" data-act="card-no">Ещё учить</button><button class="btn" data-act="card-yes">Знаю</button></div>`:""}`;
  }
  if (s.mode==="article") {
    const a = s.answered;
    return `${prog}
      <div class="flash ${a?gClass(w):""}"><span class="de">${a?esc(w.art)+" ":"___ "}${esc(w.w)}</span><span class="hint">${esc(w.ru)}</span></div>
      <div class="big3">${ARTS.map(x=>`<button class="${x}" data-pick="${x}" ${a?"disabled":""}>${x}</button>`).join("")}</div>
      <div class="verdict ${a?(a===w.art?"ok":"no"):""}">${a?(a===w.art?"Richtig!":`Нет: ${esc(w.art)} ${esc(w.w)}`):""}</div>
      ${a?`<button class="btn" data-act="next">Дальше</button>`:""}`;
  }
  if (!s.opts || s.optsFor !== w.id) {
    const others = shuffle([...S.words.values()].filter(x=>x.id!==w.id && x.pos===w.pos)).slice(0,3);
    const fill = others.length<3 ? shuffle([...S.words.values()].filter(x=>x.id!==w.id && !others.includes(x))).slice(0,3-others.length) : [];
    s.opts = shuffle([w, ...others, ...fill].map(x=>x.id)); s.optsFor = w.id;
  }
  const a = s.answered;
  return `${prog}
    <div class="flash" style="background:var(--lav);color:var(--on-pastel)"><span class="ru">${esc(w.ru)}</span></div>
    <div class="opts">${s.opts.map(id=>{const o=S.words.get(id)||{}; const cls = a ? (id===w.id?"right":(id===a?"wrong":"")) : ""; return `<button class="${cls}" data-opt="${esc(id)}" ${a?"disabled":""}>${apill(o)}${esc(o.w)}</button>`;}).join("")}</div>
    <div class="verdict ${a?(a===w.id?"ok":"no"):""}">${a?(a===w.id?"Richtig!":"Не то слово"):""}</div>
    ${a?`<button class="btn" data-act="next">Дальше</button>`:""}`;
}
function grade(s, ok){
  const w = S.words.get(s.deck[s.i]); if (!w) return;
  if (ok) s.right++; else s.wrong.push(w.id);
  const upd = {...w, box: Math.max(0, Math.min(5, (w.box||0) + (ok?1:-1)))};
  if (s.mode==="cards") {
    if (ok && !w.known) s.learned++;
    upd.known = ok; if (ok) upd.knownAt = Date.now();
  }
  save("words", upd);
}

/* ---------- writing challenge ---------- */
const LT = "https://api.languagetool.org/v2/check";
function startWrite(){
  const pool = poolFor(st.homeTopic).filter(w=>w.ru && w.pos!=="other");
  if (pool.length < 3) { toast("В этой теме мало слов для задания"); return; }
  openSheet({kind:"write", ids: shuffle(pool).slice(0,5).map(w=>w.id), text:"", showDe:false, busy:false, result:null, label:topicLabel(st.homeTopic)});
}
function writeBody(s){
  const ws = s.ids.map(id=>S.words.get(id)).filter(Boolean);
  return `<p class="hint">Тема: ${esc(s.label)}. Напиши 4–8 предложений на немецком и используй все слова. Форма слова может быть любой.</p>
  <div class="w-words">${ws.map(w=>`<span class="w-chip ${s.showDe?gClass(w):""}">${esc(w.ru)}${s.showDe?`<small>${esc(artText(w))}${esc(w.w)}</small>`:""}</span>`).join("")}</div>
  <div class="actions"><button class="btn small ghost" data-act="w-hint">${s.showDe?"Скрыть немецкий":"Подсказка: по-немецки"}</button><button class="btn small ghost" data-act="w-new">Другие слова</button></div>
  <div class="field"><label for="f-write">Твой текст</label><textarea id="f-write" rows="9" lang="de" spellcheck="false" autocorrect="off" autocapitalize="sentences" placeholder="Gestern habe ich …">${esc(s.text)}</textarea></div>
  <button class="btn" data-act="w-check">Проверить</button>
  <div id="write-res" class="stack"></div>`;
}
function formsOf(w){
  const out = new Set(); const add = x => { x = norm(x).trim(); if (x.length >= 2) out.add(x); };
  add(w.w); if (w.pl && w.pl!=="—") add(w.pl);
  if (w.pos==="v") {
    const v = findVerb(w.w);
    const f = v ? v : {...weakForms(w.w, ""), k2:null};
    [...(f.praes||[]), ...(f.praet||[]), ...(f.k2||[])].forEach(x => add(String(x).split(" ")[0]));
    add(f.p2||"");
  }
  return out;
}
function usesWord(text, w){
  const tokens = norm(text).split(/[^a-z]+/).filter(Boolean);
  const parts = norm(w.w).split(/[^a-z]+/).filter(x => x.length > 2 && !["sich","der","die","das","ein","eine","den","dem"].includes(x));
  const stemOf = p => p.length > 5 ? p.slice(0, p.length-2) : p.length > 3 ? p.slice(0, p.length-1) : p;
  if (parts.length > 1) return parts.every(p => tokens.some(t => t.startsWith(stemOf(p))));
  const forms = formsOf(w);
  if (tokens.some(t => forms.has(t))) return true;
  const stem = stemOf(parts[0] || norm(w.w));
  return tokens.some(t => t.startsWith(stem) || (w.pos==="v" && t.startsWith("ge"+stem)) || (stem.length > 4 && t.includes(stem)));
}
async function checkWrite(s){
  const ta = $("#f-write"); const text = ta ? ta.value : s.text; s.text = text;
  if (text.trim().split(/\s+/).length < 4) { toast("Напиши хотя бы пару предложений"); return; }
  s.busy = true; fillWriteRes(s);
  const usage = s.ids.map(id => S.words.get(id)).filter(Boolean).map(w => ({id:w.id, w:w.w, art:w.art, ru:w.ru, used:usesWord(text, w)}));
  let matches = null, err = "";
  if (navigator.onLine === false) err = "Нет интернета: проверка ошибок работает только онлайн. Использование слов я проверила.";
  else {
    try {
      const r = await fetch(LT, {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:new URLSearchParams({text, language:"de-DE", motherTongue:"ru"})});
      if (r.status === 429) throw new Error("rate");
      if (!r.ok) throw new Error("http");
      const j = await r.json();
      matches = (j.matches||[]).map(m => ({offset:m.offset, length:m.length, message:m.message, reps:(m.replacements||[]).slice(0,4).map(x=>x.value), type:(m.rule&&m.rule.issueType)||"", fixed:false}));
    } catch (e) {
      err = e && e.message==="rate" ? "Слишком много проверок подряд. Подожди минуту и нажми ещё раз." : "Сервис проверки не ответил. Проверь интернет и попробуй ещё раз.";
    }
  }
  s.busy = false; s.result = {text, usage, matches, err};
  fillWriteRes(s);
  const el = $("#write-res"); if (el && el.scrollIntoView) el.scrollIntoView({block:"start", behavior:"smooth"});
}
const ISSUE = {misspelling:"орфография", grammar:"грамматика", typographical:"пунктуация", style:"стиль", uncategorized:"", whitespace:"пробелы", duplication:"повтор"};
function fillWriteRes(s){
  const el = $("#write-res"); if (!el) return;
  if (s.busy) { el.innerHTML = `<p class="hint">Проверяю…</p>`; return; }
  const r = s.result; if (!r) { el.innerHTML = ""; return; }
  const usedN = r.usage.filter(u=>u.used).length;
  let h = `<section class="card"><span class="lbl">Слова · ${usedN} из ${r.usage.length}</span><ul class="uses">${r.usage.map(u=>`<li class="${u.used?"ok":"no"}"><b>${u.used?"✓":"✕"}</b><span>${esc(u.ru)} → <strong>${esc(artText(u))}${esc(u.w)}</strong>${u.used?"":` <span class="hint">не нашла в тексте</span>`}</span></li>`).join("")}</ul>
    <p class="hint" style="margin-top:8px">Слова ищу по формам и основе, поэтому редкие формы могу не узнать.</p></section>`;
  if (r.err) h += `<p class="hint err">${esc(r.err)}</p>`;
  if (r.matches) {
    const open = r.matches.map((m,i)=>({m,i})).filter(x=>!x.m.fixed).sort((a,b)=>a.m.offset-b.m.offset);
    let ann = "", pos = 0;
    open.forEach((x,n) => { const m = x.m; if (m.offset < pos) return; ann += esc(r.text.slice(pos, m.offset)); ann += `<mark>${esc(r.text.slice(m.offset, m.offset+m.length)) || "&nbsp;"}<sup>${n+1}</sup></mark>`; pos = m.offset + m.length; });
    ann += esc(r.text.slice(pos));
    h += `<section class="card"><span class="lbl">${open.length ? "Ошибки: "+open.length : "Ошибок не нашла"}</span>
      <div class="annot">${ann.replace(/\n/g,"<br>")}</div>
      ${open.length ? `<ol class="errs">${open.map((x,n)=>{ const m = x.m; const frag = r.text.slice(m.offset, m.offset+m.length);
        return `<li><span class="num">${n+1}</span><div class="body"><span><span class="frag">«${esc(frag)}»</span>${ISSUE[m.type]?` <span class="tag">${ISSUE[m.type]}</span>`:""}</span><span>${esc(m.message)}</span>
          <div class="actions">${m.reps.map((v,j)=>`<button class="chip act" data-act="w-fix" data-m="${x.i}" data-r="${j}">${esc(v)||"удалить"}</button>`).join("")}<button class="chip" data-act="w-skip" data-m="${x.i}">Пропустить</button></div></div></li>`; }).join("")}</ol>` : `<p class="hint" style="margin-top:8px">Сервис LanguageTool находит не всё: смысл и порядок слов лучше перепроверить самой.</p>`}
    </section>`;
  }
  el.innerHTML = h;
}
function applyFix(s, mi, ri){
  const r = s.result; const m = r && r.matches && r.matches[mi]; if (!m) return;
  const ta = $("#f-write");
  if (ta && ta.value !== r.text) { toast("Текст изменился. Нажми «Проверить» ещё раз"); return; }
  const rep = m.reps[ri] ?? "";
  r.text = r.text.slice(0, m.offset) + rep + r.text.slice(m.offset + m.length);
  const delta = rep.length - m.length;
  m.fixed = true;
  r.matches.forEach(o => { if (!o.fixed && o.offset > m.offset) o.offset += delta; });
  s.text = r.text; if (ta) ta.value = r.text;
  fillWriteRes(s);
}

      await save("rules", o); toast("Сохранено"); openSheet({kind:"rule", id}); break;
    }
    case "confirm-rule": { const r = S.rules.get(s.id); const o={...r, check:false}; delete o.checkNote; await save("rules", o); toast("Отмечено как проверенное"); break; }
    /* training */
    case "flip": s.flipped = !s.flipped; drawSheet(); break;
    case "dir-de": s.dir="de"; s.flipped=false; drawSheet(); break;
    case "dir-ru": s.dir="ru"; s.flipped=false; drawSheet(); break;
    case "card-yes": case "card-no": grade(s, act==="card-yes"); s.i++; s.flipped=false; drawSheet(); break;
    case "next": s.i++; s.answered=null; drawSheet(); break;
    case "redo-wrong": openSheet({...s, deck:shuffle(s.wrong), i:0, right:0, wrong:[], learned:0, answered:null, flipped:false}); break;
    case "train-again": { const m = s.mode; closeSheet(); startTrain(m, "home"); break; }
    /* writing */
    case "w-hint": s.showDe = !s.showDe; drawSheet(); break;
    case "w-new": { const pool = poolFor(st.homeTopic).filter(w=>w.ru && w.pos!=="other"); s.ids = shuffle(pool).slice(0,5).map(w=>w.id); s.result = null; drawSheet(); break; }
    case "w-check": checkWrite(s); break;
    case "w-fix": applyFix(s, +d.m, +d.r); break;
    case "w-skip": { const m = s.result && s.result.matches[+d.m]; if (m) { m.fixed = true; fillWriteRes(s); } break; }
    /* data */
    case "export": {
      const data = JSON.stringify(exportObj(), null, 1);
      const name = "deutsch-heft-" + new Date().toISOString().slice(0,10) + ".json";
      const file = new File([data], name, {type:"application/json"});
      try {
        if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); toast("Копия готова"); }
        else { const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 1000); toast("Файл сохранён в «Загрузки»"); }
      } catch (err) { if (!err || err.name !== "AbortError") { s.text = data; drawSheet(); toast("Файл не сохранился, скопируй текст"); } }
      break;
    }
    case "export-text": s.text = JSON.stringify(exportObj()); drawSheet(); break;
    case "copy-export": { const ta = $("#f-export"); try { await navigator.clipboard.writeText(ta.value); toast("Скопировано"); } catch { ta.focus(); ta.select(); toast("Выделено: скопируй вручную"); } break; }
    case "import": { const v = $("#f-import").value.trim(); if (!v) { toast("Выбери файл или вставь текст"); return; } await doImport(v); break; }
    case "rename-topic": {
      const nv = ($("#tp-"+d.i)||{}).value; if (nv == null) return;
      const nt = nv.trim(), old = d.old;
      if (nt === old) return;
      saveMany("words", [...S.words.values()].filter(w=>(w.topic||"").trim()===old).map(w=>({...w, topic:nt})));
      if (st.homeTopic===old) { st.homeTopic = nt; lsSet("heft-home-topic", nt); }
      if (st.topic===old) st.topic = nt;
      toast(nt ? `Тема переименована: ${nt}` : "Тема убрана"); break;
    }
  }
});
$("#btn-data").addEventListener("click", () => openSheet({kind:"data", text:null}));
$("#btn-search").addEventListener("click", () => { if (st.tab!=="words") setTab("words"); const q = $("#q"); if (q) q.focus(); });
$("#btn-search").innerHTML = ICON.search;
document.querySelectorAll(".nav button").forEach(b => b.innerHTML = ICON[b.dataset.tab]);
initStore();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
